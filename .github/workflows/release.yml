name: Release

# Push a tag such as v0.9.0 to publish that version. The tag must match the version in
# pbiviz.json (0.9.0.0 for v0.9.0) and have a section in CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Tag matches the version
        run: |
          want="$(node -p 'require("./pbiviz.json").visual.version.replace(/\.0$/, "")')"
          [ "v${want}" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but pbiviz.json says ${want}"; exit 1; }
          grep -q "^## ${want}\b" CHANGELOG.md || { echo "No CHANGELOG.md section for ${want}"; exit 1; }
      - run: npm ci
      - run: npx eslint .
      - run: npx pbiviz package
      - name: Name the file and add checksums
        run: |
          mkdir out
          cp dist/*.pbiviz out/TrailsBI.pbiviz
          cd out && sha256sum TrailsBI.pbiviz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" out/* --title "TrailsBI visual ${ver}" --notes-file notes.md --prerelease
